defaults: # - folder: file.yaml to include under the "folder" named property of cfg
  - _self_  # Hydra magic
  - dataset: fiqa
  - retriever: tf_idf
  - model: encoder


device: cpu
base_path: "."
top_k: 10

# Keep Hydra in the current directory to ensure relative paths are correct
hydra:
  run:
    dir: "outputs/tf_idf/"  # Separate directory for evaluation outputs